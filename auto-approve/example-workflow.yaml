name: Auto approve

# An agent reviews the pull request with its normal tools and records a verdict by
# writing /tmp/verdict.json. The step after it holds the bot token and approves
# only when that verdict is low risk and the guards hold. Review threads must still
# be resolved before the merge, which branch protection requires.
#
# `pull_request_target` runs this file from the base branch, so a pull request
# cannot rewrite the job that approves it or reach the OpenRouter key.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: auto-approve-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-approve:
    name: auto-approve
    # The workflow file comes from the pull request's base branch, so any other base would run that
    # branch's copy of it with these secrets in scope. Keep them out of reach entirely.
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Auto approve
        uses: worldcoin/gh-actions-public/auto-approve@main
        # More information: https://github.com/worldcoin/gh-actions-public/tree/main/auto-approve
        with:
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          bot-token: ${{ secrets.BOT_TOKEN }}
          bot-login: my-bot
